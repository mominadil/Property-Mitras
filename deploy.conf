# ── Staging server connection ───────────────────────────────────────────────
# deploy.conf is gitignored — it holds secrets/host info, never commit it.
#
# Property Mitras — WordPress on CloudPanel (AWS EC2, ap-south-1 / Mumbai).
# Infrastructure and runbooks: github.com/mominadil/seoxpert360-infra

# SSH connection to your staging server
SSH_HOST="13.232.54.1"                  # Elastic IP, static - will not change
SSH_USER="propmitras"                   # CloudPanel site user, scoped to this site only
SSH_PORT="22"
# SSH_KEY="$HOME/.ssh/id_rsa"           # key auth is for the 'ubuntu' admin user, not this one
SSH_PASS="bGi0VQbje9qS7oxvXPn7"

# Where WordPress lives on the staging server (the dir containing wp-config.php)
REMOTE_PATH="/home/propmitras/htdocs/propertymitras.seoxpert360.com"

# How to invoke WP-CLI on the staging server.
#
# Spelled out on purpose. /usr/bin/wp is the raw phar and its shebang resolves
# `php` to 8.4, while this website runs on PHP 8.3 (fpm port 18002). Running the
# CLI on a different version from the site is wrong regardless of symptoms. The
# ~/bin/wp wrapper also forces 8.3, but this path cannot be defeated by shell
# config, so it is the safe choice for an unattended script.
REMOTE_WP="/usr/bin/php8.3 /usr/bin/wp"

# Public URLs (scheme + host, no trailing slash). Used for search-replace so
# links, Elementor data and options point at the right domain after a sync.
STAGING_URL="https://propertymitras.seoxpert360.com"

# ── Notes specific to this site ─────────────────────────────────────────────
#
# WordPress 7.1.2 · PHP 8.3 · MySQL 8.4 (Percona) · table prefix pm_
# Database 'propertymitras'. Credentials live in wp-config.php; WP-CLI reads
# them itself, so no DB settings are needed here.
#
# SSH is firewalled to 103.203.146.0/24 (the admin ISP range). Deploying from
# anywhere else needs that range added to security group sg-0dda218a6600246e0.
#
# The site user has a shell, no sudo, and cannot read the other sites on this
# host - verified. The 'ubuntu' account is the admin path and uses key auth:
#   ssh -i laravel-cms-key.pem ubuntu@13.232.54.1
#
# BACKUPS: /usr/local/bin/site-backup.sh runs nightly at 02:15 UTC and discovers
# this site automatically. Seven-day retention in /var/backups/sites.
# Encrypted off-server copies live in the seoxpert360-infra repo.
#
# !! blog_public is currently 0 — search engines are told not to index this site.
# Set it to 1 at launch:
#   $REMOTE_WP --path="$REMOTE_PATH" option update blog_public 1
#
# PHP-FPM is capped at pm.max_children=6 for this pool. The box has 2 GB RAM and
# CloudPanel's default of 250 would let PHP exhaust it and trigger the OOM
# killer, taking down every site. Check `free -m` before raising it.
#
# all-in-one-wp-migration is active here. Its import limit is bounded by PHP's
# upload_max_filesize / post_max_size (32M). For anything larger, restore via
# WP-CLI and a database dump instead of the plugin.
